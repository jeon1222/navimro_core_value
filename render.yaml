services:
  - type: web
    name: navimro-core-value
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: navimro-core-value-db
          property: connectionString

databases:
  - name: navimro-core-value-db
    region: singapore
    plan: free
